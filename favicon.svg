<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ajay Sommi">
  <!--
    The site's mark, in its own vocabulary: the flat shapes of the hero
    composition on a paper tile. An accent quarter disc, a blue circle and an
    ink triangle, nothing overlapping, so it reads at 16px. The tile turns to
    charcoal when the system is dark, like the site.
  -->
  <style>
    .tile { fill: #f2f0eb; }
    .ink { fill: #141414; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #1a1a1a; }
      .ink { fill: #edebe6; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="15"/>
  <path d="M9 55V27A28 28 0 0 1 37 55Z" fill="#ff5a1f"/>
  <circle cx="44" cy="20" r="11" fill="#2f4bff"/>
  <path class="ink" d="M41 55h14V41Z"/>
</svg>
