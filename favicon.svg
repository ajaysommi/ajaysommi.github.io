<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ajay Sommi">
  <!--
    "Aj" in the site's flat shape language: the A as a solid ink chevron,
    the j as a blue dot over a blue stem, finished by an orange hook. The
    tile follows the system theme, charcoal in dark and paper in light, and
    the A flips with it.
  -->
  <style>
    .tile { fill: #f2f0eb; }
    .ink { fill: #141414; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #121212; }
      .ink { fill: #f1efea; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="15"/>
  <path class="ink" d="M10.29 44.57 L30.86 9.90 L43.20 32.70 L43.20 36.19 L36.19 36.19 L30.86 26.67 L20.19 44.57Z"/>
  <circle cx="48.20" cy="17.40" r="5.60" fill="#3d68ff"/>
  <rect x="43.83" y="24.60" width="8.74" height="11.79" fill="#3d68ff"/>
  <path d="M26.25 36.19 A13.16 13.16 0 0 0 52.57 36.19 L43.83 36.19 A4.42 4.42 0 0 1 34.99 36.19Z" fill="#ff6b35"/>
</svg>
