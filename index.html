  <script>
    /* Which machine this visitor gets is settled before anything draws: a
       phone gets the pocket device, everything else the desk of computers. */
    (function () {
      var root = document.documentElement;
      var pocket = matchMedia('(max-width: 760px), (max-height: 520px) and (pointer: coarse)').matches;
      root.className = (pocket ? 'is-pocket' : 'is-desk') + ' js';
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.add('reduced');
      root.dataset.mode = pocket ? 'pocket' : 'desk';
    })();
  </script>
