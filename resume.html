<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume — Ajay Sommi</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .frame{max-width:1100px; margin:40px auto; padding:16px}
    .embed{aspect-ratio:8.5/11; width:100%; border:1px solid var(--border); border-radius:16px; overflow:hidden}
    .note{color:var(--text-secondary); margin:12px 0}
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-container">
      <div class="nav-logo">Ajay Sommi</div>
      <nav class="nav-links">
        <a href="index.html#projects" class="nav-link">Projects</a>
        <a href="index.html#experience" class="nav-link">Experience</a>
        <a href="index.html#contact" class="nav-link cta">Contact</a>
      </nav>
    </div>
  </header>
  <main class="frame">
    <h1 style="font-size:1.4rem;margin:10px 0 16px">Resume</h1>
    <div class="note">Tip: open in a new tab if the inline preview is slow.</div>
    <div class="embed" style="background: var(--surface); box-shadow: var(--shadow-md);">
      <!-- Replace resume.pdf with your actual file name -->
      <iframe src="./Ajay_Sommi_Resume.pdf" title="Ajay Sommi — Resume" style="width:100%;height:100%;border:0;"></iframe>
    </div>
    <p class="note"><a class="btn btn-primary" href="./Ajay_Sommi_Resume.pdf" download>Download PDF</a></p>
  </main>
  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="y"></span> Ajay Sommi</p>
    </div>

  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
